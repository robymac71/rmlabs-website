<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok OAuth — RMLABS</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.5; color: #1a1a1a; }
    code, pre { background: #f4f4f4; padding: 0.15rem 0.35rem; border-radius: 4px; word-break: break-all; }
    pre { padding: 0.75rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>RMLABS — TikTok autorizzazione</h1>
  <p>Se vedi questa pagina dopo il login TikTok, l’autorizzazione è andata a buon fine.</p>
  <p><strong>Copia il valore <code>code</code> qui sotto</strong> e incollalo nello script (non condividere in chat pubbliche):</p>
  <pre id="out">In attesa dei parametri…</pre>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get("code");
    const err = p.get("error");
    const desc = p.get("error_description");
    const el = document.getElementById("out");
    if (err) {
      el.textContent = "Errore: " + err + (desc ? "\n" + desc : "");
    } else if (code) {
      el.textContent = code;
    } else {
      el.textContent = "Nessun code nella URL. Query: " + location.search;
    }
  </script>
</body>
</html>
